# Ambiente di prova: Home Assistant con le entità "demo", una plancia di esempio e MMOUi Personal Theme.
# → http://localhost:8123 (al primo avvio crea l'utente dall'onboarding)
# I dati di HA finiscono in dev/config (ignorati da git); il tema è montato in sola lettura.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./dev/config:/config
      - ./themes:/config/themes:ro
