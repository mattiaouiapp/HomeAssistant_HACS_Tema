title: MMOUi
views:
  - title: Casa
    path: casa
    type: sections
    max_columns: 3
    badges:
      - entity: sensor.outside_temperature
      - entity: sensor.outside_humidity
      - entity: sensor.power_consumption
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Luci
          - type: tile
            entity: light.ceiling_lights
            features:
              - type: light-brightness
          - type: tile
            entity: light.kitchen_lights
          - type: tile
            entity: light.bed_light
          - type: tile
            entity: switch.decorative_lights
          - type: tile
            entity: fan.living_room_fan
            features:
              - type: fan-speed
      - type: grid
        cards:
          - type: heading
            heading: Clima
          - type: thermostat
            entity: climate.hvac
          - type: tile
            entity: cover.kitchen_window
            features:
              - type: cover-open-close
      - type: grid
        cards:
          - type: heading
            heading: Media ed energia
          - type: media-control
            entity: media_player.living_room
          - type: gauge
            entity: sensor.outside_humidity
            needle: true
            severity:
              green: 30
              yellow: 60
              red: 80
          - type: entities
            title: Controlli
            entities:
              - switch.ac
              - switch.decorative_lights
              - lock.front_door
              - vacuum.demo_vacuum_0_ground_floor
